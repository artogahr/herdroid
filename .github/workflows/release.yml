name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Build the signed APK
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          HERDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HERDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HERDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export HERDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HERDROID_KEYSTORE"
          nix develop --command ./gradlew --console=plain test :app:assembleRelease -Pherdroid.version="$VERSION"
          rm "$HERDROID_KEYSTORE"

      - name: Verify and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          apk="dist/herdroid-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          cp android/app/build/outputs/mapping/release/mapping.txt "dist/herdroid-$VERSION-mapping.txt"
          certs="$(nix develop --command bash -c "\$ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs '$apk'")"
          cert_sha256="$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          if [ -z "$cert_sha256" ]; then
            echo "::error::The APK is not signed"
            exit 1
          fi
          (cd dist && sha256sum "herdroid-$VERSION.apk" > "herdroid-$VERSION.apk.sha256")
          {
            echo
            echo "### Verify the download"
            echo
            echo '```'
            echo "SHA-256 of herdroid-$VERSION.apk: $(cut -d' ' -f1 "dist/herdroid-$VERSION.apk.sha256")"
            echo "Signing certificate SHA-256:  $cert_sha256"
            echo '```'
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Herdroid $VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}"
