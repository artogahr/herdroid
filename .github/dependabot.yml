version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      androidx:
        patterns: ['androidx.*', 'com.android.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
    ignore:
      # Must match the bcutil version that sshj depends on; bump it together with sshj.
      - dependency-name: org.bouncycastle:bcprov-jdk18on
